[pytest]
# Run Uber Learn tests inside the tutor dev container:
#
#   docker exec lms bash -c \
#     "cd /edx/app/edxapp/edx-platform && \
#      python -m pytest lms/djangoapps/uber_learn/tests/ -v \
#      --ds=lms.envs.test"
#
# Or with the Makefile shortcut (once added):
#   make test-uber-learn
#
DJANGO_SETTINGS_MODULE = lms.envs.test
python_files = test_*.py
python_classes = Test
python_functions = test_
addopts =
    --tb=short
    -v
